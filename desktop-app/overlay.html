<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Magsika Reminder — Timer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    -webkit-app-region: no-drag;
    user-select: none;
  }
  .pill {
    display: flex; align-items: center; gap: 10px;
    height: 100%; padding: 0 16px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f43f5e; flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .info { min-width: 0; }
  .project {
    color: #e2e8f0; font-size: 11.5px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 190px;
  }
  .timer {
    color: #a5b4fc; font-size: 15px; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: 0.3px;
    margin-top: 1px;
  }
  .timer.overdue { color: #fca5a5; }
</style>
</head>
<body>
  <div class="pill">
    <span class="dot"></span>
    <div class="info">
      <div class="project" id="project">—</div>
      <div class="timer" id="timer">00:00:00</div>
    </div>
  </div>

<script>
  const projectEl = document.getElementById("project");
  const timerEl = document.getElementById("timer");
  let startedAt = null;
  let baseElapsed = 0;    // detik yang udah kepakai dari sesi sebelumnya (pause/resume)
  let durationSecs = null; // budget waktu dari task (null = gak ada budget, fallback hitung maju)
  let tickHandle = null;

  function pad(n) { return String(n).padStart(2, "0"); }

  function fmtClock(totalSeconds) {
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function tick() {
    if (!startedAt) return;
    const elapsedSec = baseElapsed + Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
    if (durationSecs !== null) {
      // Hitung MUNDUR dari sisa waktu yang dikasih PM/admin, bukan hitung maju
      // dari nol -- biar tim langsung lihat berapa lama lagi jatahnya, bukan
      // harus ngitung sendiri dari elapsed vs budget.
      const remaining = durationSecs - elapsedSec;
      const overdue = remaining <= 0;
      timerEl.textContent = (overdue ? "-" : "") + fmtClock(Math.abs(remaining));
      timerEl.classList.toggle("overdue", overdue);
    } else {
      // Task ini gak dikasih durasi/budget -- gak ada yang bisa dihitung mundur,
      // fallback nunjukin durasi kerja yang udah lewat aja.
      timerEl.textContent = fmtClock(elapsedSec);
      timerEl.classList.remove("overdue");
    }
  }

  window.desktopApp.onOverlayUpdate((data) => {
    projectEl.textContent = data.project || data.title || "Task";
    startedAt = data.timer_started ? new Date(data.timer_started).getTime() : Date.now();
    baseElapsed = data.time_elapsed || 0;
    durationSecs = typeof data.duration_seconds === "number" ? data.duration_seconds : null;
    tick();
    clearInterval(tickHandle);
    tickHandle = setInterval(tick, 1000);
  });
</script>
</body>
</html>
