<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Login — Magsika Reminder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f172a; font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .card { width: 320px; padding: 28px 26px; }
  h1 { color: #fff; font-size: 18px; font-weight: 800; margin: 0 0 2px; }
  p.sub { color: #94a3b8; font-size: 12px; margin: 0 0 20px; }
  label { display: block; color: #cbd5e1; font-size: 12px; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155;
    background: #1e293b; color: #fff; font-size: 13px; outline: none;
  }
  input:focus { border-color: #6366f1; }
  button {
    width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 10px;
    background: #4f46e5; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #4338ca; }
  button:disabled { opacity: 0.6; cursor: default; }
  #err { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔔 Magsika Reminder</h1>
    <p class="sub">Login pakai akun workspace kamu supaya reminder task nyala di laptop ini.</p>
    <form id="form">
      <label>Email</label>
      <input id="email" type="email" required autocomplete="username" />
      <label>Password</label>
      <input id="password" type="password" required autocomplete="current-password" />
      <button id="btn" type="submit">Masuk</button>
      <div id="err"></div>
    </form>
  </div>

<script>
  const form = document.getElementById("form");
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Memproses...";
    try {
      const backendUrl = await window.desktopApp.getBackendUrl();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const res = await fetch(`${backendUrl}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Email atau password salah");
      }
      const data = await res.json();
      window.desktopApp.loginSuccess({ token: data.access_token, user: data.user });
    } catch (ex) {
      err.textContent = ex.message || "Gagal login, cek koneksi internet.";
      btn.disabled = false;
      btn.textContent = "Masuk";
    }
  });
</script>
</body>
</html>
