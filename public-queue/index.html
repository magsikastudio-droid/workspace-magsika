<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Live commission queue — track the status of active orders in real time." />
<meta property="og:title" content="Magsika Queue" />
<meta property="og:description" content="Live commission queue — track the status of active orders in real time." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>" />
<title>Magsika Queue</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: #14161d;
    --panel-2: #1b1e27;
    --border: #262a35;
    --text: #eef0f4;
    --muted: #8b90a0;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #191c26 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 40px 24px 28px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #9fb4ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .discord-link {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    background: rgba(88,101,242,0.15);
    border: 1px solid rgba(88,101,242,0.4);
    padding: 6px 14px;
    border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .discord-link:hover {
    background: rgba(88,101,242,0.28);
    border-color: rgba(88,101,242,0.7);
  }
  .discord-link svg { width: 15px; height: 15px; fill: #8fa0ff; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }
  #board {
    display: flex;
    gap: 18px;
    padding: 4px 24px 40px;
    overflow-x: auto;
    align-items: flex-start;
  }
  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    min-width: 270px;
    max-width: 300px;
    flex: 1 0 270px;
    overflow: hidden;
  }
  .column-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.2px;
    position: relative;
  }
  .column-header::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--dot, var(--accent));
  }
  .column-header .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot, var(--accent));
    display: inline-block;
    margin-right: 8px;
  }
  .col-title { display: flex; align-items: center; }
  .count {
    background: var(--panel-2);
    color: var(--muted);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .cards {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 40px;
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--dot, var(--accent));
    border-radius: 10px;
    padding: 12px 13px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-1px);
    border-color: #3a3f4f;
  }
  .card .project {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .card .client {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card .code {
    font-size: 10px;
    color: #565c6d;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin-top: 6px;
    word-break: break-word;
  }
  .card .meta {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .badge {
    background: rgba(122,162,255,0.12);
    color: var(--accent);
    border-radius: 5px;
    padding: 2px 7px;
    font-weight: 500;
  }
  .timer {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted);
  }
  .timer.running { color: #4ade80; }
  .timer .tdot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 1.6s infinite;
  }
  .progress {
    margin-top: 9px;
    height: 4px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
  }
  .empty-col {
    color: var(--muted);
    font-size: 12px;
    padding: 10px 4px;
    text-align: center;
  }
  #status-line {
    text-align: center;
    padding: 0 24px 24px;
    color: #4b5060;
    font-size: 11px;
  }
  .error { color: #ff8a8a; }
</style>
</head>
<body>
<header>
  <h1>Magsika Queue</h1>
  <a class="discord-link" href="https://discord.gg/zTYNtgSvW" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24"><path d="M20.317 4.369A19.791 19.791 0 0 0 16.558 3c-.211.375-.444.87-.608 1.262a18.27 18.27 0 0 0-5.9 0A12.64 12.64 0 0 0 9.442 3a19.736 19.736 0 0 0-3.762 1.37C2.68 8.58 1.907 12.678 2.294 16.72a19.9 19.9 0 0 0 5.993 3.03c.483-.658.914-1.357 1.284-2.09a12.9 12.9 0 0 1-2.022-.97c.17-.124.336-.253.497-.386 3.9 1.81 8.13 1.81 11.984 0 .162.133.328.262.497.386-.646.383-1.323.71-2.024.971.37.732.8 1.431 1.283 2.089a19.83 19.83 0 0 0 6.002-3.03c.462-4.687-.766-8.746-3.471-12.351ZM8.68 14.246c-1.156 0-2.102-1.06-2.102-2.36 0-1.303.926-2.362 2.102-2.362 1.187 0 2.123 1.069 2.103 2.362 0 1.3-.926 2.36-2.103 2.36Zm6.647 0c-1.157 0-2.102-1.06-2.102-2.36 0-1.303.925-2.362 2.102-2.362 1.187 0 2.123 1.069 2.102 2.362 0 1.3-.915 2.36-2.102 2.36Z"/></svg>
    Join our Discord
  </a>
</header>
<div id="board"></div>
<div id="status-line"></div>

<script>
const STATUS_ORDER = ["Need Designer", "Pending", "Modeling", "Teksturing", "Rigging", "Revisi", "Done"];
const STATUS_COLORS = {
  "Need Designer": "#f5a623",
  "Pending": "#8b90a0",
  "Modeling": "#7aa2ff",
  "Teksturing": "#c792ea",
  "Rigging": "#ff9f68",
  "Revisi": "#ff6b6b",
  "Done": "#4ade80",
};
const REFRESH_MS = 20000;
let latestOrders = [];

function milestoneProgress(milestones) {
  if (!milestones || !milestones.length) return null;
  const done = milestones.filter(m => m.status === "done").length;
  return Math.round((done / milestones.length) * 100);
}

function formatDuration(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return [h, m, sec].map(v => String(v).padStart(2, "0")).join(":");
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function timerElapsedNow(timer) {
  if (!timer) return 0;
  let base = timer.elapsed_seconds || 0;
  if (timer.running && timer.started_at) {
    const started = new Date(timer.started_at).getTime();
    const now = Date.now();
    if (timer.date && timer.date < todayStr()) {
      const endOfDay = new Date(timer.date + "T23:59:59").getTime();
      base += Math.max(0, Math.min(endOfDay, now) - started) / 1000;
    } else {
      base += Math.max(0, now - started) / 1000;
    }
  }
  return base;
}

function renderCard(order) {
  const pct = milestoneProgress(order.milestones);
  const timer = order.timer;
  let timerHtml = "";
  if (timer && (timer.running || (timer.elapsed_seconds || 0) > 0)) {
    const running = !!timer.running;
    timerHtml = `
      <div class="timer ${running ? "running" : ""}" data-running="${running}" data-elapsed="${timer.elapsed_seconds || 0}" data-started="${timer.started_at || ""}" data-date="${timer.date || ""}">
        ${running ? '<span class="tdot"></span>' : "⏱"} <span class="timer-value">${formatDuration(timerElapsedNow(timer))}</span>
      </div>`;
  }
  return `
    <div class="card">
      <div class="project">${escapeHtml(order.project || "Untitled")}</div>
      ${order.client ? `<div class="client">${escapeHtml(order.client)}</div>` : ""}
      <div class="meta">
        ${order.work_type ? `<span class="badge">${escapeHtml(order.work_type)}</span>` : ""}
        ${order.deadline ? `<span>Due ${escapeHtml(order.deadline)}</span>` : ""}
      </div>
      ${timerHtml}
      ${pct !== null ? `<div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
      ${order.code ? `<div class="code">${escapeHtml(order.code)}</div>` : ""}
    </div>
  `;
}

function render(orders) {
  latestOrders = orders;
  const board = document.getElementById("board");
  const grouped = {};
  for (const o of orders) {
    const s = o.status || "Pending";
    (grouped[s] = grouped[s] || []).push(o);
  }
  const statuses = [...STATUS_ORDER.filter(s => grouped[s]), ...Object.keys(grouped).filter(s => !STATUS_ORDER.includes(s))];
  board.innerHTML = statuses.map(status => {
    const items = grouped[status] || [];
    const color = STATUS_COLORS[status] || "#7aa2ff";
    return `
      <div class="column">
        <div class="column-header" style="--dot:${color}">
          <span class="col-title"><span class="dot"></span>${escapeHtml(status)}</span>
          <span class="count">${items.length}</span>
        </div>
        <div class="cards">
          ${items.length ? items.map(renderCard).join("") : `<div class="empty-col">No orders</div>`}
        </div>
      </div>
    `;
  }).join("");
}

function tickTimers() {
  document.querySelectorAll('.timer[data-running="true"]').forEach(el => {
    const elapsed = timerElapsedNow({
      running: true,
      elapsed_seconds: parseFloat(el.getAttribute("data-elapsed")) || 0,
      started_at: el.getAttribute("data-started") || null,
      date: el.getAttribute("data-date") || null,
    });
    const valueEl = el.querySelector(".timer-value");
    if (valueEl) valueEl.textContent = formatDuration(elapsed);
  });
}

async function load() {
  const line = document.getElementById("status-line");
  try {
    const res = await fetch("/api/public/queue");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data.orders || []);
    line.textContent = "";
    line.classList.remove("error");
  } catch (e) {
    line.textContent = "Unable to load data: " + e.message;
    line.classList.add("error");
  }
}

load();
setInterval(load, REFRESH_MS);
setInterval(tickTimers, 1000);
</script>
</body>
</html>
