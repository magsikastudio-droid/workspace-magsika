<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Reminder — Magsika</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #dc2626; user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; animation: flash 1.2s ease-in-out infinite;
  }
  @keyframes flash { 0%, 100% { background: #dc2626; } 50% { background: #991b1b; } }
  .icon { font-size: 72px; animation: ring 0.8s ease-in-out infinite; }
  @keyframes ring { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } }
  h1 { color: #fff; font-size: 34px; font-weight: 900; margin: 18px 0 6px; letter-spacing: 0.02em; }
  p.title { color: #fecaca; font-size: 20px; font-weight: 600; margin: 0 0 8px; max-width: 80vw; }
  p.hint { color: #fca5a5; font-size: 13px; margin: 0 0 32px; }
  button {
    padding: 16px 40px; border: none; border-radius: 14px; cursor: pointer;
    background: #fff; color: #b91c1c; font-weight: 800; font-size: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  button:hover { background: #fee2e2; }
</style>
</head>
<body>
  <div class="icon">⏰</div>
  <h1 id="headline">Belum Mulai Kerja!</h1>
  <p class="title" id="taskTitle"></p>
  <p class="hint" id="hint"></p>
  <button id="ackBtn">Oke, Saya Mulai Sekarang →</button>

<script>
  const params = new URLSearchParams(window.location.search);
  const taskTitle = params.get("title") || "task hari ini";
  const taskId = params.get("taskId") || "";
  const orderId = params.get("orderId") || "";
  const kind = params.get("kind") || "not_started"; // "not_started" | "not_streaming" | "review"

  // Konfigurasi per jenis alarm — teks, tombol, suara, dan aksi klik semua beda
  // biar tim langsung ngerti dari bunyi/tampilannya tanpa perlu baca detail.
  const CONFIG = {
    not_started: {
      headline: "Belum Mulai Kerja!",
      hint: "Ayo klik tombol di bawah, langsung mulai timer + rekam layar — tidak perlu buka web dulu.",
      button: "Oke, Mulai Timer + Rekam →",
      speakText: `Ayo mulai kerjain: ${taskTitle}`,
      beep: { notes: [660, 0, 520, 0, 660, 0, 440], wave: "sine" }, // turun-turun, nada rendah
      action: "start-work", // PATCH timer dulu, baru buka picker
    },
    not_streaming: {
      headline: "Timer Jalan, Belum Live Stream!",
      hint: "Timer kamu sudah jalan tapi layar belum di-share. Klik untuk mulai rekam sekarang.",
      button: "Oke, Mulai Rekam Sekarang →",
      speakText: `Timer jalan tapi belum live stream: ${taskTitle}`,
      beep: { notes: [440, 0, 440, 0, 880, 0, 880], wave: "triangle" }, // dua nada bolak-balik — beda karakter lagi
      action: "start-recording-only", // timer udah jalan, langsung picker aja
    },
    review: {
      headline: "Task Menunggu Review!",
      hint: "Ada task yang perlu dicek.",
      button: "Oke, Saya Mulai Sekarang →",
      speakText: `Ada task menunggu review: ${taskTitle}`,
      beep: { notes: [880, 0, 1100, 0, 880, 0, 1320], wave: "square" }, // naik-naik — alarm lama
      action: "open-dashboard",
    },
  };
  const cfg = CONFIG[kind] || CONFIG.not_started;

  document.getElementById("headline").textContent = cfg.headline;
  document.getElementById("taskTitle").textContent = taskTitle;
  document.getElementById("hint").textContent = cfg.hint;
  document.getElementById("ackBtn").textContent = cfg.button;

  const BEEP_PATTERN = cfg.beep;

  let audioCtx;
  function playBeep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      BEEP_PATTERN.notes.forEach((freq, i) => {
        if (!freq) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = BEEP_PATTERN.wave; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, now + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.15);
        osc.start(now + i * 0.18); osc.stop(now + i * 0.18 + 0.15);
      });
    } catch (_) {}
  }

  // Suara Indonesia beneran lewat gTTS server (dijamin logat Indonesia,
  // tidak gantung ke voice OS yang belum tentu ke-install di laptop baru).
  // Fallback ke speechSynthesis browser kalau internet/server lagi bermasalah.
  let currentAudio = null;
  async function speak() {
    try {
      const audioB64 = await window.desktopApp.getTtsAudio(cfg.speakText);
      if (audioB64) {
        const binary = atob(audioB64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: "audio/mpeg" });
        currentAudio = new Audio(URL.createObjectURL(blob));
        currentAudio.play();
        return;
      }
    } catch (_) {}
    speakFallback();
  }

  function speakFallback() {
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(cfg.speakText);
    utter.lang = "id-ID"; utter.rate = 0.9;
    const run = () => {
      const voice = speechSynthesis.getVoices().find(v => v.lang.startsWith("id"))
        || speechSynthesis.getVoices().find(v => v.lang.startsWith("en"));
      if (voice) utter.voice = voice;
      speechSynthesis.speak(utter);
    };
    if (speechSynthesis.getVoices().length) run();
    else speechSynthesis.onvoiceschanged = run;
  }

  playBeep();
  speak();
  const beepInterval = setInterval(playBeep, 4000);

  document.getElementById("ackBtn").addEventListener("click", () => {
    clearInterval(beepInterval);
    speechSynthesis.cancel();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const action = !taskId ? "open-dashboard" : cfg.action; // tanpa task_id, tidak ada yang bisa di-PATCH
    if (action === "start-work") {
      window.desktopApp.startWork({ taskId, taskTitle, orderId });
    } else if (action === "start-recording-only") {
      window.desktopApp.startWork({ taskId, taskTitle, orderId, skipTimerPatch: true });
    } else {
      // "review" itu aksi admin (approve/reject) — arahkan ke dashboard, bukan mulai kerja.
      window.desktopApp.openDashboard();
    }
    window.close();
  });
</script>
</body>
</html>
