<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Pilih Layar — Magsika Reminder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: #0f172a; color: #fff;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  h1 { font-size: 15px; font-weight: 800; margin: 0 0 3px; }
  p.sub { color: #94a3b8; font-size: 12px; margin: 0 0 16px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px; max-height: 380px; overflow-y: auto;
  }
  .card {
    cursor: pointer; border: 2px solid #334155; border-radius: 10px; overflow: hidden;
    background: #1e293b; transition: border-color 0.15s;
  }
  .card:hover { border-color: #6366f1; }
  .card img { width: 100%; height: 90px; object-fit: cover; display: block; background: #000; }
  .card .name {
    padding: 6px 8px; font-size: 11px; color: #cbd5e1; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #empty { color: #94a3b8; font-size: 13px; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
  <h1>🖥️ Pilih layar buat direkam</h1>
  <p class="sub">Kalau ada 2 monitor, pilih yang kamu pakai kerja. Ini akan direkam selama kamu ngerjain task ini (mirip pas klik "Mulai" di web).</p>
  <div class="grid" id="grid"></div>
  <div id="empty" style="display:none;">Tidak ada layar terdeteksi.</div>

<script>
  let picked = false;

  (async () => {
    const sources = await window.desktopApp.getScreenSources();
    const grid = document.getElementById("grid");
    if (!sources.length) {
      document.getElementById("empty").style.display = "block";
      return;
    }
    sources.forEach((s) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<img src="${s.thumbnail}" /><div class="name">${s.name}</div>`;
      card.addEventListener("click", () => { picked = true; window.desktopApp.pickSource(s.id); });
      grid.appendChild(card);
    });
  })();

  // Kalau window ditutup TANPA milih (mis. klik X) — kabarin main process biar
  // tidak nyangkut nunggu pilihan yang tidak akan pernah datang.
  window.addEventListener("beforeunload", () => { if (!picked) window.desktopApp.cancelPicker(); });
</script>
</body>
</html>
