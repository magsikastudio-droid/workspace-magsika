server {
    listen 80;
    server_name workspace.magsikastudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name workspace.magsikastudio.com;

    ssl_certificate /etc/letsencrypt/live/workspace.magsikastudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.magsikastudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /root/admin-dashboard/frontend/dist;
    index index.html;

    # ── WebSocket ─────────────────────────────────────────────
    # HARUS di atas location /api/ supaya prefix /api/ws punya
    # prioritas lebih tinggi (nginx pakai longest-prefix match).
    #
    # /api/ws       → http://127.0.0.1:8001/ws       (notifikasi)
    # /api/ws/rtc   → http://127.0.0.1:8001/ws/rtc   (live stream)
    location /api/ws {
        proxy_pass         http://127.0.0.1:8001/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── REST API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Desktop app installer + auto-update feed ───────────────
    # electron-updater (provider "generic") cek & download dari sini.
    location /downloads/desktop-app/ {
        alias /root/admin-dashboard/desktop-app-dist/;
        autoindex off;
    }

    # ── Frontend SPA ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
