server {
    listen 80;
    server_name queue.magsikastudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name queue.magsikastudio.com;

    ssl_certificate /etc/nginx/ssl/queue.magsikastudio.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/queue.magsikastudio.com/privkey.pem;

    root /root/admin-dashboard/public-queue;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/public/ws {
        proxy_pass http://127.0.0.1:8001/public/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
